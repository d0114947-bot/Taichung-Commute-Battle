<title>台中通勤大作戰</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap">
<style>
/* 版面：左欄是一張「通勤單」（出發、抵達、時間、比較），右側是地圖；手機上下排列。
   風格：純白紙面、細線、明體標題，只用一個朱色做重點。刻意只做亮色版。 */
:root{
  --bg:#ffffff; --ink:#262626; --ink2:#4d4d4d; --muted:#8e8e8e; --hair:#e8e8e8; --hair2:#f5f5f5;
  --accent:#a8412d; --accent-soft:#f8eeeb; --ok:#3e6e54; --danger:#a8412d;
  --mrt:#3e8e62; --bus:#c47830; --rail:#3c5aa0; --car:#6a5aa8; --scooter:#b24f6e; --walk:#7a7a7a; --bike:#2f878c; --taxi:#ad8c1b;
  --policy:#c23b28; --project:#2e4a8e; --exist:#a3a3a3; --orangeline:#d9822b;
  --tile-bg:#fcfcfb; --tile-road:#efefec; --tile-block1:#f7f7f5; --tile-block2:#f4f4f2; --tile-block3:#f8f6f3; --tile-park:#eff3ec;
  --serif:'Noto Serif TC','Songti TC','PMingLiU',serif;
  --sans:'Noto Sans TC',-apple-system,'PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  color-scheme:light; --fs:1;
}
html[data-fs="s"]{--fs:.9} html[data-fs="m"]{--fs:1.12} html[data-fs="l"]{--fs:1.32}
.tools{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.fsz{display:flex;align-items:center;gap:2px;font-size:calc(13px * var(--fs));color:var(--ink2)}
.fsz>span{margin-right:6px;letter-spacing:.1em}
.fsz button{border:1px solid var(--hair);background:#fff;min-width:34px;min-height:34px;cursor:pointer;color:var(--ink2);padding:2px 6px;line-height:1}
.fsz button[data-arg="s"]{font-size:calc(12px * var(--fs))}.fsz button[data-arg="m"]{font-size:calc(15px * var(--fs))}.fsz button[data-arg="l"]{font-size:calc(18px * var(--fs))}
.fsz button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
/* 教學：聚光框＋說明框＋手指 */
.tour-hl{position:relative;z-index:2600!important;outline:2px solid var(--accent);outline-offset:4px;border-radius:2px;background:#fff;box-shadow:0 0 0 9999px rgba(30,30,30,.38)}
.tour-tip{position:fixed;z-index:2700;background:#fff;border:1px solid var(--ink);padding:14px 16px 12px;max-width:min(340px,calc(100vw - 32px));box-shadow:0 6px 24px rgba(0,0,0,.18);font-size:calc(14.5px * var(--fs));line-height:1.65}
.tour-tip h4{margin:0 0 4px;font-family:var(--serif);font-size:calc(16px * var(--fs));letter-spacing:.06em}
.tour-tip .step{font-size:calc(11px * var(--fs));letter-spacing:.2em;color:var(--muted)}
.tour-tip .row2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px}
.tour-tip button{font-size:calc(13px * var(--fs))}
.tour-finger{position:fixed;z-index:2750;font-size:calc(34px * var(--fs));pointer-events:none;animation:tap 1s ease-in-out infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
@keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){.tour-finger{animation:none}}
[hidden]{display:none!important}
.live-mk{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--danger);background:#fff;font-size:calc(13px * var(--fs));line-height:1;display:grid;place-items:center;cursor:pointer;transform:translate(-50%,-50%);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.k.tt{font-size:calc(10px * var(--fs));letter-spacing:.08em;color:var(--ink2);border:1px solid currentColor;border-radius:2px;padding:0 4px;margin-left:2px}
.live-note{color:var(--danger)}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:400;font-size:calc(15px * var(--fs));line-height:1.7;margin:0;letter-spacing:.02em}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:1.5px solid var(--accent);outline-offset:3px}
a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--hair);text-underline-offset:3px}
a:hover{text-decoration-color:var(--accent)}

/* Leaflet 1.9.4 核心樣式（精簡內嵌） */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;font-size:calc(12px * var(--fs));background:var(--tile-bg)}
.leaflet-tile,.leaflet-marker-icon{-webkit-user-select:none;user-select:none;-webkit-user-drag:none}
.leaflet-marker-icon{display:block}
.leaflet-container .leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}
.leaflet-container .leaflet-tile-pane img,.leaflet-container .leaflet-tile{max-width:none!important;max-height:none!important;width:auto;padding:0}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}
.leaflet-container.leaflet-touch-drag{touch-action:none}
.leaflet-tile{filter:inherit;visibility:hidden}
.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200;filter:grayscale(1) contrast(.9) brightness(1.06)}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane svg{z-index:200}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right}
.leaflet-top .leaflet-control{margin-top:12px}.leaflet-right .leaflet-control{margin-right:12px}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:grabbing}
.leaflet-marker-icon,.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive{pointer-events:auto}
.leaflet-marker-draggable{cursor:move}
.leaflet-bar{border:1px solid var(--hair);background:#fff}
.leaflet-bar a{background:#fff;color:var(--ink2);border-bottom:1px solid var(--hair);width:30px;height:30px;display:block;text-align:center;text-decoration:none;font:300 18px/30px var(--sans)}
.leaflet-bar a:last-child{border-bottom:none}
.leaflet-container .leaflet-control-attribution{background:rgba(255,255,255,.9);color:var(--muted);margin:0;padding:1px 6px;font-size:calc(10.5px * var(--fs));line-height:1.5}
.leaflet-control-attribution a{color:var(--ink2);text-decoration:none}

/* ---------- 版面 ---------- */
.app{display:flex;flex-direction:column;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--ink);margin-bottom:20px;flex-wrap:wrap}
.top h1{font-family:var(--serif);font-weight:600;font-size:calc(28px * var(--fs));letter-spacing:.12em;margin:0;line-height:1.2}
.top .en{font-size:calc(11px * var(--fs));letter-spacing:.32em;color:var(--muted);text-transform:uppercase;margin-left:12px}
.top nav{display:flex;gap:18px;font-size:calc(13px * var(--fs))}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;color:var(--ink2);text-decoration:underline;text-decoration-color:var(--hair);text-underline-offset:4px}
.linkbtn:hover{text-decoration-color:var(--accent)}
.stage{display:grid;grid-template-columns:minmax(330px,420px) minmax(0,1fr);gap:28px;flex:1;min-height:0}
@media (max-width:920px){.stage{grid-template-columns:1fr;gap:20px}}
.panel{display:flex;flex-direction:column;gap:22px;min-width:0}
.mapbox{position:relative;border:1px solid var(--hair);min-height:620px;background:var(--tile-bg);overflow:hidden}
@media (max-width:920px){.mapbox{min-height:440px;order:-1}}
#map{position:absolute;inset:0;overflow:hidden}

/* ---------- 通勤單 ---------- */
.sec{display:flex;flex-direction:column;gap:10px}
.lbl{font-size:calc(11.5px * var(--fs));letter-spacing:.24em;color:var(--muted)}
.where{display:grid;grid-template-columns:22px 1fr;column-gap:10px;row-gap:2px;align-items:start}
.where .dot{width:10px;height:10px;border-radius:50%;margin:16px 0 0 5px;border:1.5px solid var(--ink)}
.where .dot.d{background:var(--accent);border-color:var(--accent)}
.where .rail{grid-column:1;width:1px;background:var(--hair);margin-left:10px;height:100%}
.addr-in{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--hair);min-width:0}
.addr-in:focus-within{border-bottom-color:var(--ink)}
.addr-in input{flex:1;min-width:0;border:0;padding:9px 0;background:transparent;font-family:var(--serif);font-size:calc(17px * var(--fs));outline:none}
.addr-in input::placeholder{color:#b8b8b8}
.addr-in button{border:0;background:none;color:var(--accent);font-size:calc(13px * var(--fs));cursor:pointer;padding:6px 0;white-space:nowrap}
.addr-meta{font-size:calc(12px * var(--fs));color:var(--muted);line-height:1.5;min-height:1.5em}
.addr-meta b{font-weight:500;color:var(--ink2)}
.sugg{list-style:none;margin:4px 0 0;padding:0;border:1px solid var(--hair);background:#fff}
.sugg li+li{border-top:1px solid var(--hair2)}
.sugg button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;cursor:pointer;font-size:calc(13.5px * var(--fs));line-height:1.45}
.sugg button:hover{background:var(--hair2)}
.sugg small{display:block;color:var(--muted);font-size:calc(11.5px * var(--fs))}
.presets{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:calc(12.5px * var(--fs))}
.presets button{background:none;border:0;padding:0;color:var(--ink2);cursor:pointer;text-decoration:underline;text-decoration-color:var(--hair);text-underline-offset:3px}
.when{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.when label{display:flex;flex-direction:column;gap:2px;font-size:calc(11.5px * var(--fs));letter-spacing:.24em;color:var(--muted)}
.when input{border:0;border-bottom:1px solid var(--hair);padding:7px 0;font-family:var(--serif);font-size:calc(17px * var(--fs));background:transparent;letter-spacing:.04em;color:var(--ink)}

/* ---------- 比較 ---------- */
.lead{font-family:var(--serif);font-size:calc(19px * var(--fs));line-height:1.6;text-wrap:balance;margin:0}
.lead em{font-style:normal;color:var(--accent)}
.rows{border-top:1px solid var(--ink)}
.row{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--hair);padding:12px 2px;cursor:pointer}
.row:hover{background:var(--hair2)}
.row .ic{font-size:calc(19px * var(--fs));filter:grayscale(.35)}
.row .nm{font-size:calc(15px * var(--fs));font-weight:500;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.row .nm small{font-size:calc(11px * var(--fs));color:var(--accent);letter-spacing:.2em;font-weight:400}
.row .sub{font-size:calc(12px * var(--fs));color:var(--muted);display:block}
.row .min{font-family:var(--serif);font-size:calc(28px * var(--fs));line-height:1;text-align:right;font-variant-numeric:tabular-nums}
.row .min span{font-size:calc(12px * var(--fs));font-family:var(--sans);color:var(--muted);margin-left:2px}
.row.best .min{color:var(--accent)}
.row.hyp{background:linear-gradient(90deg,var(--accent-soft),transparent 75%);padding-top:8px;padding-bottom:10px}
.row.hyp .min{font-size:calc(24px * var(--fs))}
.pair{border-bottom:1px solid var(--ink)}.pair .row{border-bottom:1px dashed var(--hair)}.pair .row:last-child{border-bottom:0}
.rows{border-top:1px solid var(--ink)}
.tagp{font-size:calc(12.5px * var(--fs));color:var(--accent);letter-spacing:.12em;border-left:2px solid var(--accent);padding-left:7px}
.gain{font-style:normal;color:var(--accent);font-weight:500}.same{color:var(--muted)}
.concl{border:1px solid var(--accent);padding:16px 18px;background:linear-gradient(180deg,var(--accent-soft),#fff 60%)}
.concl .big{font-family:var(--serif);font-size:calc(18px * var(--fs));line-height:1.6;margin:6px 0 8px}.concl b{color:var(--accent);font-size:1.15em}
.concl ul{margin:4px 0 8px;padding-left:18px;font-size:calc(14px * var(--fs))}.concl .cheer{font-weight:500}
.island{display:block;text-align:center;text-decoration:none;margin:12px 0 6px}
.polbtn{width:100%;text-align:center;font-size:calc(15px * var(--fs));letter-spacing:.08em}
details.pol{border-bottom:1px solid var(--hair)}details.pol summary{cursor:pointer;padding:9px 2px;font-size:calc(14.5px * var(--fs));list-style:none;display:flex;gap:8px;align-items:center}
details.pol summary::-webkit-details-marker{display:none}details.pol summary:before{content:"▸";color:var(--muted);font-size:calc(12px * var(--fs));transition:transform .15s}
details.pol[open] summary:before{transform:rotate(90deg)}details.pol[open] summary{color:var(--accent)}
.pol-body{padding:0 2px 12px 18px;font-size:calc(13.5px * var(--fs))}.pol-body p{margin:4px 0}.pol-body .src{font-size:calc(12px * var(--fs));color:var(--muted)}
.k.sim{font-size:calc(10px * var(--fs));color:var(--accent);border:1px solid currentColor;padding:0 4px;letter-spacing:.06em}.k.mapk{font-size:calc(10px * var(--fs));color:var(--project);border:1px solid currentColor;padding:0 4px}
.simline{color:var(--accent)!important}
.sheet .box{position:relative}.tour-ol{padding-left:20px;margin:6px 0}.tour-ol li{margin:4px 0}
.sheet-x{position:absolute;top:10px;right:12px;border:0;background:none;font-size:calc(22px * var(--fs));cursor:pointer;color:var(--muted)}
.fine{font-size:calc(12px * var(--fs));color:var(--muted);line-height:1.6;margin:0}

/* ---------- 政見地圖 ---------- */
.switch{display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:calc(14px * var(--fs))}
.switch input{appearance:none;width:30px;height:16px;border:1px solid var(--ink2);border-radius:999px;position:relative;flex:none;margin-top:4px;cursor:pointer;background:#fff}
.switch input:before{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:var(--ink2);top:2px;left:2px;transition:left .15s}
.switch input:checked{background:var(--accent);border-color:var(--accent)}
.switch input:checked:before{left:16px;background:#fff}
.switch small{display:block;color:var(--muted);font-size:calc(12px * var(--fs))}
.legend{display:flex;flex-direction:column;gap:4px;font-size:calc(12px * var(--fs));color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{display:inline-block;width:28px;height:0;border-top:3px solid}
.legend i.p{border-color:var(--policy);border-top-style:dotted}
.legend i.j{border-color:var(--project);border-top-style:dashed}
.legend i.e{border-color:var(--exist)}
.plist{list-style:none;margin:0;padding:0;font-size:calc(13px * var(--fs))}
.plist li{border-bottom:1px solid var(--hair2)}
.plist button{width:100%;text-align:left;background:none;border:0;padding:6px 0;cursor:pointer;display:flex;gap:8px;align-items:baseline}
.plist button:hover{color:var(--accent)}
.k{font-size:calc(10.5px * var(--fs));letter-spacing:.14em;white-space:nowrap}
.k.policy{color:var(--policy)}.k.project{color:var(--project)}.k.exist{color:var(--muted)}.k.news{color:var(--danger)}.k.sim{color:var(--muted)}

/* ---------- 模擬中 ---------- */
.legs{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.legs li{display:grid;grid-template-columns:26px 1fr auto;gap:10px;padding:9px 2px;border-bottom:1px solid var(--hair);font-size:calc(13.5px * var(--fs))}
.legs li.now{background:var(--accent-soft)}
.legs li.done{color:var(--muted)}
.legs .t{font-family:var(--serif);font-variant-numeric:tabular-nums}
.choices{display:flex;flex-direction:column;gap:6px}
.btn{border:1px solid var(--ink);background:#fff;padding:10px 14px;cursor:pointer;font-size:calc(14px * var(--fs));text-align:left}
.btn:hover{background:var(--ink);color:#fff}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:hover{background:var(--accent);border-color:var(--accent)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.log{display:flex;flex-direction:column;gap:6px;font-size:calc(13px * var(--fs))}
.log div{padding-left:10px;border-left:2px solid var(--hair)}
.log div.ev{border-color:var(--danger)}.log div.policy{border-color:var(--policy)}.log div.project{border-color:var(--project)}
.result .big{font-family:var(--serif);font-size:calc(30px * var(--fs));line-height:1.3}
.result.late .big{color:var(--danger)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--hair);margin-top:10px}
.kv div{padding:8px 0}.kv div+div{padding-left:12px;border-left:1px solid var(--hair)}
.kv dt{font-size:calc(11px * var(--fs));letter-spacing:.2em;color:var(--muted)}.kv dd{margin:0;font-family:var(--serif);font-size:calc(18px * var(--fs));font-variant-numeric:tabular-nums}

/* ---------- 地圖上的元素 ---------- */
.hud{position:absolute;z-index:1100;top:12px;left:12px;right:58px;background:rgba(255,255,255,.96);border:1px solid var(--hair);padding:6px 14px;display:flex;flex-wrap:wrap;gap:2px 16px;align-items:baseline;font-size:calc(13px * var(--fs))}
.hud .clock{font-family:var(--serif);font-size:calc(24px * var(--fs));font-variant-numeric:tabular-nums}
.map-note{position:absolute;z-index:1100;left:12px;bottom:22px;max-width:calc(100% - 24px);background:rgba(255,255,255,.96);border:1px solid var(--hair);color:var(--muted);padding:4px 10px;font-size:calc(11.5px * var(--fs));line-height:1.5}
.tok{position:relative;width:40px;height:40px}
.tok .face{position:absolute;left:4px;top:0;font-size:calc(24px * var(--fs))}
.tok .veh{position:absolute;right:-2px;bottom:-2px;font-size:calc(16px * var(--fs));background:#fff;border:1px solid var(--ink);border-radius:50%;width:24px;height:24px;display:grid;place-items:center}
.tok.bounce .face{animation:hop .5s ease-in-out infinite alternate}
@keyframes hop{to{transform:translateY(-4px)}}
.pin{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--ink);box-shadow:0 0 0 4px rgba(255,255,255,.9)}
.pin.d{background:var(--accent);border-color:var(--accent)}
.pin-lbl{font-family:var(--serif);font-size:calc(13px * var(--fs));white-space:nowrap;background:#fff;border:1px solid var(--ink);padding:0 6px;transform:translate(14px,-26px);display:inline-block}
.stn{width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--mrt)}
.stn.tra{border-color:var(--rail);border-radius:1px}
.stn-label{font-size:calc(10.5px * var(--fs));color:var(--ink2);white-space:nowrap;text-shadow:0 0 2px #fff,0 0 2px #fff,0 0 3px #fff;transform:translate(8px,-7px)}
.pol-label{font-size:calc(11px * var(--fs));white-space:nowrap;background:#fff;padding:0 5px;border:1px solid currentColor;transform:translate(-50%,-50%);display:inline-block;letter-spacing:.06em}
.pol-label.policy{color:var(--policy)}.pol-label.project{color:var(--project)}.pol-label.exist{color:var(--muted)}
.bub{position:relative;width:min(280px,64vw);background:#fff;color:var(--ink);padding:12px 14px;font-size:calc(13px * var(--fs));line-height:1.6;border:1px solid var(--ink);box-shadow:6px 6px 0 rgba(0,0,0,.06);transform:translate(-50%,calc(-100% - 16px))}
.bub:after{content:"";position:absolute;left:calc(50% - var(--dx,0px));bottom:-8px;margin-left:-7px;width:13px;height:13px;background:#fff;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);transform:rotate(45deg)}
.bub.below{transform:translate(-50%,18px)}
.bub.below:after{top:-8px;bottom:auto;transform:rotate(-135deg)}
.bub.policy{border-color:var(--policy)}.bub.policy:after{border-color:var(--policy)}
.bub.project{border-color:var(--project)}.bub.project:after{border-color:var(--project)}
.bub h4{margin:0 0 4px;font-family:var(--serif);font-size:calc(15px * var(--fs));font-weight:600;line-height:1.4}
.bub p{margin:0 0 6px}

const fmt = m => { m = Math.round(m); const d = Math.floor(m / 1440); m -= d * 1440; if (m < 0) m += 1440; return `${Math.floor(m / 60)}:${pad2(m % 60)}`; };

function km(a, b) {
  const R = 6371, r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}

/* ============================ 3. LeafletLoader ============================ */
const LeafletLoader = (() => {
  const SOURCES = ['https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js',
                   'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js',
                   'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js'];
  const st = { status: 'pending', src: null, failed: [] };
  let promise = null;
  const tryOne = src => new Promise(resolve => {
    const el = document.createElement('script');
    const done = ok => { clearTimeout(t); el.onload = el.onerror = null; resolve(ok); };
    const t = setTimeout(() => done(false), 8000);
    el.onload = () => done(!!(window.L && window.L.map));
    el.onerror = () => done(false);
    el.src = src; el.async = true; el.crossOrigin = 'anonymous';
    document.head.appendChild(el);
  });
  function load() {
    if (promise) return promise;
    promise = (async () => {
      if (window.L && window.L.map) { st.status = 'ok'; st.src = '已存在'; return true; }
      for (const src of SOURCES) {
        if (await tryOne(src)) { st.status = 'ok'; st.src = src; return true; }
        st.failed.push(src.split('/')[2]);
      }
      st.status = 'failed'; return false;
    })();
    return promise;
  }
  return { load, state: st };
})();

/* ============================ 4. Routing ============================ */
/** 可連網時用 OSRM 取得實際道路／步行路徑；失敗時回傳 null，由 Planner 改用估算並標示 */
const Routing = (() => {
  const URL = { car: 'https://routing.openstreetmap.de/routed-car/route/v1/driving/', foot: 'https://routing.openstreetmap.de/routed-foot/route/v1/driving/',
                bike: 'https://routing.openstreetmap.de/routed-bike/route/v1/driving/' };
  const cache = new Map();
  const st = { status: 'idle', ok: 0, failed: 0, msg: '' };
  const key = (p, a, b) => `${p}:${a.lat.toFixed(5)},${a.lng.toFixed(5)}>${b.lat.toFixed(5)},${b.lng.toFixed(5)}`;
  async function get(profile, a, b) {
    const k = key(profile, a, b);
    if (cache.has(k)) return cache.get(k);
    let res = null;
    try {
      const ac = new AbortController(); const t = setTimeout(() => ac.abort(), 6000);
      const r = await fetch(`${URL[profile]}${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`, { signal: ac.signal });
      clearTimeout(t);
      if (!r.ok) throw new Error(`HTTP ${r.status}`);
      const j = await r.json(); const rt = j.routes && j.routes[0];
      if (!rt) throw new Error(j.code || '無路徑');
      res = { km: rt.distance / 1000, pts: rt.geometry.coordinates.map(([lng, lat]) => ({ lat, lng })) };
      st.ok++; st.status = 'ok';
    } catch (e) {
      st.failed++; if (st.status !== 'ok') st.status = 'failed';
      st.msg = e.name === 'AbortError' ? '連線逾時' : '無法連線（離線，或預覽環境禁止連外）';
    }
    cache.set(k, res);
    return res;
  }
  return { get, state: st, peek: (p, a, b) => cache.get(key(p, a, b)) };
})();

    const t = arriveIso(dateStr, arriveMin), k = rkey(a, b, t.iso);
    if (cache.has(k)) return cache.get(k);
    const j = await call('tomtom-routing', { locations: [[a.lng, a.lat], [b.lng, b.lat]], arriveAt: t.iso, traffic: 'historical', response_detail: 'geometry' });
    const f = j && j.features && j.features[0], s = f && f.properties && f.properties.summary;
    if (!s) throw Object.assign(new Error('TomTom 沒有回傳路線'), { code: 'tool_error' });
    const g = j.geometry && j.geometry.features && j.geometry.features[0];
    const pts = g && g.geometry && g.geometry.coordinates ? g.geometry.coordinates.map(([lng, lat]) => ({ lat, lng })) : [a, b];
    const res = { km: s.lengthInMeters / 1000, min: s.travelTimeInSeconds / 60, delayMin: (s.trafficDelayInSeconds || 0) / 60,
      pts, at: t, roads: [...new Set(((f.properties.sections || {}).importantRoadStretch || []).map(x => x.streetName).filter(Boolean))].slice(0, 3) };
    cache.set(k, res); st.lastRoute = res;
    return res;
  }

  /* ---------- 其他交通方式的道路路徑 ----------
   * TomTom 只有汽車路網。機車：避開國道與收費道路（台灣機車不能上國道），依預測車流。
   * 腳踏車、走路、公車段：取「最短」道路、避開國道，只用來決定沿哪些道路走與距離，速度另外估算。 */
  const pcache = new Map();
  const toPath = (j, a, b) => {
    const f = j && j.features && j.features[0], s = f && f.properties && f.properties.summary;
    if (!s) throw Object.assign(new Error('TomTom 沒有回傳路線'), { code: 'tool_error' });
    const g = j.geometry && j.geometry.features && j.geometry.features[0];
    return { km: s.lengthInMeters / 1000, min: s.travelTimeInSeconds / 60, delayMin: (s.trafficDelayInSeconds || 0) / 60,
      pts: g && g.geometry && g.geometry.coordinates ? g.geometry.coordinates.map(([lng, lat]) => ({ lat, lng })) : [a, b] };
  };
  const pkey = (kind, a, b, extra = '') => `${kind}:${a.lat.toFixed(5)},${a.lng.toFixed(5)}>${b.lat.toFixed(5)},${b.lng.toFixed(5)}${extra}`;
  function peekPath(kind, a, b, dateStr, arriveMin) {
    return pcache.get(pkey(kind, a, b, kind === 'scooter' ? arriveIso(dateStr, arriveMin).iso : '')) || null;
  }
  async function path(kind, a, b, dateStr, arriveMin) {
    const t = kind === 'scooter' ? arriveIso(dateStr, arriveMin) : null, k = pkey(kind, a, b, t ? t.iso : '');
    if (pcache.has(k)) return pcache.get(k);
    const input = kind === 'scooter'
      ? { locations: [[a.lng, a.lat], [b.lng, b.lat]], arriveAt: t.iso, traffic: 'historical', avoid: ['motorways', 'tollRoads'], response_detail: 'geometry' }
      : { locations: [[a.lng, a.lat], [b.lng, b.lat]], routeType: 'short', avoid: ['motorways', 'tollRoads'], response_detail: 'geometry' };
    const res = { ...toPath(await call('tomtom-routing', input), a, b), at: t };
    pcache.set(k, res);
    return res;
  }

  /* ---------- 即時路況（事故、壅塞、封路、施工） ---------- */
  const CAT = { accident: '交通事故', jam: '壅塞', 'road-closed': '道路封閉', roadworks: '道路施工', 'lane-closed': '車道封閉', 'broken-down-vehicle': '故障車', danger: '危險路況' };
  const EVT = { 'Bridge closed': '橋梁封閉', Closed: '封閉', 'Stationary traffic': '車流停滯', 'Queuing traffic': '車流回堵', 'Slow traffic': '車流緩慢', 'Heavy traffic': '車多', Roadworks: '施工' };
  /** 查路線範圍內「現在」的路況，只留距離路線 300 公尺內的 */
  async function incidents(pts) {
    if (!pts || pts.length < 2) return [];
    const lats = pts.map(p => p.lat), lngs = pts.map(p => p.lng), pad = 0.01;
    const bbox = [Math.min(...lngs) - pad, Math.min(...lats) - pad, Math.max(...lngs) + pad, Math.max(...lats) + pad].map(v => +v.toFixed(5));
    const j = await call('tomtom-traffic', { bbox, categoryFilter: ['accident', 'jam', 'road-closed', 'roadworks', 'lane-closed', 'broken-down-vehicle'],
      timeValidityFilter: ['present'], maxResults: 25, response_detail: 'geometry' });
    const list = (j && j.incidents) || [], geo = (j && j.geometry && j.geometry.features) || [];
    const step = Math.max(1, Math.floor(pts.length / 300)), sample = pts.filter((_, i) => i % step === 0);
    const near = q => sample.some(p => km(p, q) < 0.3);
    const out = [];
    list.forEach((inc, i) => {
      const g = geo.find(x => x.properties && x.properties.incident === i);
      const line = g && g.geometry && g.geometry.coordinates ? g.geometry.coordinates.map(([lng, lat]) => ({ lat, lng })) : [];
      if (!line.length) return;
      const hit = line.find(near); if (!hit) return;
      out.push({ cat: inc.category, catName: CAT[inc.category] || inc.category, from: inc.from || '', to: inc.to || '', m: inc.lengthInMeters || 0,
        delay: inc.magnitudeOfDelay || '', events: (inc.events || []).map(e => EVT[e] || e), at: hit, line });
    });
    st.lastTraffic = { at: new Date(), n: out.length, total: (j && j.incidentSummary && j.incidentSummary.totalIncidents) || list.length };
    return out;
  }
  return { init, search, reverse, route, peek, path, peekPath, incidents, arriveIso, explain, state: st, SERVER };
})();

/* ============================ 地址定位（Geocoder） ============================
 * 依序嘗試：TomTom（Claude 連接器）→ Photon（komoot，OSM）→ Nominatim（OSM）。
 * 在 Claude 頁面中只有 TomTom 能用（網頁不能直接連外）；在一般瀏覽器開啟時改用後兩者。 */
const Geocoder = (() => {
  const BOX = { w: 120.45, s: 23.95, e: 121.45, n: 24.45 };
  const inBox = p => p.lng >= BOX.w && p.lng <= BOX.e && p.lat >= BOX.s && p.lat <= BOX.n;
  const st = { last: '', errors: [] };
  async function get(url) {
    const ac = new AbortController(); const t = setTimeout(() => ac.abort(), 6000);
    try { const r = await fetch(url, { signal: ac.signal, headers: { 'Accept-Language': 'zh-TW' } }); if (!r.ok) throw new Error(`HTTP ${r.status}`); return await r.json(); }
    finally { clearTimeout(t); }
  }
  async function photon(q) {
    const j = await get(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&lat=24.15&lon=120.66&limit=8`);
    return (j.features || []).map(f => {
      const p = f.properties || {}, [lng, lat] = f.geometry.coordinates;
      const addr = [p.city || p.county, p.district, p.street, p.housenumber && `${p.housenumber}號`].filter(Boolean).join('');
      return { name: p.name || addr || q, addr: addr || p.name || '', lat, lng, precision: p.housenumber ? '門牌' : p.type === 'street' ? '道路' : p.type === 'house' ? '門牌' : '地點', src: 'Photon（OSM）' };
    }).filter(inBox);
  }
  async function nominatim(q) {
    const j = await get(`https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=8&countrycodes=tw&viewbox=${BOX.w},${BOX.n},${BOX.e},${BOX.s}&bounded=1&q=${encodeURIComponent(q)}`);
    return (j || []).map(r => ({ name: r.name || r.display_name.split(',')[0], addr: r.display_name, lat: +r.lat, lng: +r.lon,
      precision: r.address && r.address.house_number ? '門牌' : r.category === 'highway' ? '道路' : '地點', src: 'Nominatim（OSM）' }));
  }
  async function search(q) {
    st.errors = [];
    if (await TomTom.init()) {
      try { const r = await TomTom.search(q); if (r.length) { st.last = 'TomTom'; return { results: r, provider: 'TomTom' }; } st.errors.push('TomTom：台中範圍內查無結果'); }
      catch (e) { st.errors.push(`TomTom：${TomTom.explain(e)}`); }
    }
    for (const [name, fn] of [['Photon', photon], ['Nominatim', nominatim]]) {
      try { const r = await fn(q); if (r.length) { st.last = name; return { results: r, provider: name }; } st.errors.push(`${name}：查無結果`); }
      catch (e) { st.errors.push(`${name}：${e.name === 'AbortError' ? '逾時' : '無法連線'}`); }
    }
    return { results: [], provider: null };
  }
  /** 常用地點也可用名稱直接比對（離線可用） */
  const local = q => { const s = q.replace(/\s/g, ''); return PICKABLE.filter(p => p.name.includes(s) || s.includes(p.name.replace(/^捷運|站$/g, ''))).slice(0, 6)
    .map(p => ({ ...p, precision: '地標', src: p.src })); };
  return { search, local, state: st };
})();

/* ============================ 5. Planner ============================ */
/**
 * 每種方式回傳：分鐘數、花費、各段路線（含地圖線條）。時間以「出發時的路況」計算，
 * 並從指定的到達時間往回推出最晚出發時間（反覆計算 3 次以對齊出發時段的路況）。
 */
const MODES = {
  car:     { name: '開車',     icon: '🚗', color: '--car' },
  scooter: { name: '騎機車',   icon: '🛵', color: '--scooter' },
  transit: { name: '大眾運輸', icon: '🚇', color: '--mrt' },
  walk:    { name: '走路',     icon: '🚶', color: '--walk' },
  bike:    { name: '騎腳踏車', icon: '🚲', color: '--bike' },
};
const BASE_MODES = Object.keys(MODES);
for (const m of BASE_MODES) MODES[`${m}P`] = { ...MODES[m], name: `${MODES[m].name}・政見版`, hyp: true, base: m };
const baseOf = m => MODES[m].base || m;
const LEG = {
  walk: { icon: '🚶', color: '--walk', name: '步行' }, bus: { icon: '🚌', color: '--bus', name: '公車' },
  mrt: { icon: '🚇', color: '--mrt', name: '捷運綠線' }, tra: { icon: '🚆', color: '--rail', name: '台鐵' },
  blue: { icon: '🚇', color: '--project', name: '藍線（政見版）' }, orange: { icon: '🚇', color: '--orangeline', name: '橘線（政見版）' },
  car: { icon: '🚗', color: '--car', name: '開車' }, scooter: { icon: '🛵', color: '--scooter', name: '騎機車' },
  bike: { icon: '🚲', color: '--bike', name: '騎腳踏車' }, taxi: { icon: '🚕', color: '--taxi', name: '計程車' },
};
const Planner = (() => {
  const WALK_KMH = 4.6, DETOUR = 1.35, WALK_DETOUR = 1.3;
  /** 道路距離與路線：有 OSRM 用 OSRM（估算），否則直線×繞行係數（模擬，地圖畫虛線） */
  function road(profile, a, b) {
    const r = Routing.peek(profile, a, b);
    if (r) return { km: r.km, pts: r.pts, real: true, src: 'OSRM' };
    const t = profile !== 'car' && TomTom.peekPath('slow', a, b);
    if (t) return { km: t.km, pts: t.pts, real: true, src: 'TomTom' };
    return { km: km(a, b) * (profile === 'foot' ? WALK_DETOUR : DETOUR), pts: [a, b], real: false };
  }
  function roadMode(mode, O, D, dateStr, dep, arriveMin) {
    const c = congestion(dateStr, dep);
    const tt = (mode === 'car' || mode === 'scooter') && arriveMin != null ? TomTom.peek(O, D, dateStr, arriveMin) : null;
    if (mode === 'car' && tt) {
      const park = c >= 1.5 ? 8 : 5, min = tt.min + park + 3;
      return { min, cost: tt.km * 2.4 + 40, cong: c, real: true, tt: true, ttAt: tt.at, ttDelay: tt.delayMin,
        legs: [{ mode: 'car', from: O, to: D, min, wait: 0, pts: tt.pts, dashed: false, km: tt.km,
                 note: `TomTom 預測車流（${tt.at.label}）：道路 ${tt.km.toFixed(1)} km、車程 ${Math.round(tt.min)} 分${tt.delayMin >= 1 ? `（其中塞車 ${Math.round(tt.delayMin)} 分）` : ''}；另加找車位 ${park} 分、走到門口 3 分（模擬）` }],
        costNote: '油錢每公里 $2.4＋停車 $40（模擬）' };
    }
    const sc = mode === 'scooter' && arriveMin != null ? TomTom.peekPath('scooter', O, D, dateStr, arriveMin) || tt : null;
    if (mode === 'scooter' && sc) {
      const ride = Math.max(sc.min - sc.delayMin * 0.55, sc.km / 45 * 60) * 1.05, own = sc !== tt;
      return { min: ride + 4, cost: sc.km * 0.8 + 10, cong: c, real: true, tt: true, ttAt: tt ? tt.at : sc.at,
        legs: [{ mode: 'scooter', from: O, to: D, min: ride + 4, wait: 0, pts: sc.pts, dashed: false, km: sc.km,
                 note: `${own ? 'TomTom 避開國道的路線' : 'TomTom 開車路線'}：道路 ${sc.km.toFixed(1)} km；機車受塞車影響約一半、停車 4 分（估算）` }],
        costNote: '油錢每公里 $0.8＋停車 $10（模擬）' };
    }
    if (mode === 'car') {
      const r = road('car', O, D), drive = r.km / (38 / c) * 60, park = c >= 1.5 ? 8 : 5;
      return { min: drive + park + 3, cost: r.km * 2.4 + 40, cong: c, real: r.real,
        legs: [{ mode: 'car', from: O, to: D, min: drive + park + 3, wait: 0, pts: r.pts, dashed: !r.real, km: r.km,
                 note: `道路 ${r.km.toFixed(1)} km、路況係數 ${c.toFixed(2)}、找車位 ${park} 分` }],
        costNote: '油錢每公里 $2.4＋停車 $40（模擬）' };
    }
    if (mode === 'scooter') {
      const r = road('car', O, D), f = 1 + (c - 1) * 0.45, ride = r.km / (33 / f) * 60;
      return { min: ride + 4, cost: r.km * 0.8 + 10, cong: c, real: r.real,
        legs: [{ mode: 'scooter', from: O, to: D, min: ride + 4, wait: 0, pts: r.pts, dashed: !r.real, km: r.km, note: `道路 ${r.km.toFixed(1)} km，機車受塞車影響較小（模擬）` }],
        costNote: '油錢每公里 $0.8＋停車 $10（模擬）' };
    }
    if (mode === 'walk') {
      const r = road('foot', O, D), min = r.km / WALK_KMH * 60;
      return { min, cost: 0, cong: c, real: r.real, legs: [{ mode: 'walk', from: O, to: D, min, wait: 0, pts: r.pts, dashed: !r.real, km: r.km, note: `步行 ${r.km.toFixed(1)} km${r.real ? `（沿 ${r.src} 道路）` : '（直線估算）'}` }], costNote: '免費' };
    }
    const r = road('bike', O, D), min = r.km / 14 * 60 + 3;
    return { min, cost: 10, cong: c, real: r.real, legs: [{ mode: 'bike', from: O, to: D, min, wait: 0, pts: r.pts, dashed: !r.real, km: r.km, note: `騎乘 ${r.km.toFixed(1)} km${r.real ? `（沿 ${r.src} 道路）` : '（直線估算）'}、借還車 3 分` }],
      costNote: '以 YouBike 估 $10（模擬，實際費率以官方為準）' };
  }

  /** 大眾運輸：在「起點、終點、綠線 18 站、台鐵 3 站」間找最快組合（至少搭一段車） */
  function transit(O, D, dateStr, dep, pol) {
    const c = congestion(dateStr, dep);
    const BL = pol ? BLUE_SIM.stations.map((k, i) => ({ id: `b${i}`, idx: i, ...PT[k], short: PT[k].name })) : [];
    const OR = pol ? POLICY_SIM.orange.stations.map((k, i) => ({ id: `o${i}`, idx: i, ...PT[k], short: PT[k].name })) : [];
    const nodes = [{ ...O, id: 'O' }, { ...D, id: 'D' }].concat(MRT, TRA, BL, OR);   // id 放最後，避免被地點自己的 id 覆蓋
    const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
    const edges = [];
    const walkMin = d => d * WALK_DETOUR / WALK_KMH * 60;
    // 步行：1.6 km 內
    for (const a of nodes) for (const b of nodes) {
      if (a === b || b.id === 'O' || a.id === 'D') continue;
      const d = km(a, b);
      if (d <= 1.6) edges.push({ a: a.id, b: b.id, mode: 'walk', min: Math.max(1, walkMin(d)), wait: 0, cost: 0, vehicle: false });
    }
    edges.push({ a: 'm14', b: 't_daqing', mode: 'walk', min: 3, wait: 0, cost: 0, vehicle: false, note: '大慶站轉乘' });
    edges.push({ a: 't_daqing', b: 'm14', mode: 'walk', min: 3, wait: 0, cost: 0, vehicle: false, note: '大慶站轉乘' });
    // 公車（一般市區公車估算，未指定路線）
    const hwBus = Math.round(headway('bus', dateStr, dep) * (pol ? POLICY_SIM.busHw : 1)), busKmh = 20 / (1 + (c - 1) * 0.7);
    for (const n of nodes) {
      if (n.id === 'O' || n.id === 'D') continue;
      const d1 = km(O, n), d2 = km(n, D);
      if (d1 >= 1.0) edges.push({ a: 'O', b: n.id, mode: 'bus', wait: 4 + hwBus / 2, min: d1 * 1.4 / busKmh * 60 + 2, cost: 20, vehicle: true, hw: hwBus });
      if (d2 >= 1.0) edges.push({ a: n.id, b: 'D', mode: 'bus', wait: 4 + hwBus / 2, min: d2 * 1.4 / busKmh * 60 + 2, cost: 20, vehicle: true, hw: hwBus });
    }
    const dOD = km(O, D);
    if (dOD >= 1.0) edges.push({ a: 'O', b: 'D', mode: 'bus', wait: 4 + hwBus / 2, min: dOD * 1.4 / busKmh * 60 + 2, cost: 20, vehicle: true, hw: hwBus });
    // 綠線：任兩站之間（沿車站連線距離，平均時速 33 km、每站停靠 0.5 分；模擬）
    const hwM = headway('mrt', dateStr, dep);
    for (let i = 0; i < MRT.length; i++) for (let j = 0; j < MRT.length; j++) {
      if (i === j) continue;
      const seq = i < j ? MRT.slice(i, j + 1) : MRT.slice(j, i + 1).reverse();
      const k = lineKm(seq);
      edges.push({ a: MRT[i].id, b: MRT[j].id, mode: 'mrt', wait: hwM / 2, min: k / 33 * 60 + 0.5 * (seq.length - 1), cost: mrtFare(k), vehicle: true, seq, hw: hwM });
    }
    // 假設藍線通車（模擬：時速與班距為假設，站位只用已查證的地點）
    for (let i = 0; i < BL.length; i++) for (let j = 0; j < BL.length; j++) {
      if (i === j) continue;
      const seq = i < j ? BL.slice(i, j + 1) : BL.slice(j, i + 1).reverse();
      const k = lineKm(seq);
      edges.push({ a: BL[i].id, b: BL[j].id, mode: 'blue', wait: BLUE_SIM.headway / 2, min: k / BLUE_SIM.kmh * 60 + 0.5 * (seq.length - 1), cost: mrtFare(k), vehicle: true, seq, hw: BLUE_SIM.headway });
    }
    const OS = POLICY_SIM.orange;
    for (let i = 0; i < OR.length; i++) for (let j = 0; j < OR.length; j++) {
      if (i === j) continue;
      const seq = i < j ? OR.slice(i, j + 1) : OR.slice(j, i + 1).reverse();
      const k = lineKm(seq);
      edges.push({ a: OR[i].id, b: OR[j].id, mode: 'orange', wait: OS.headway / 2, min: k / OS.kmh * 60 + 0.5 * (seq.length - 1), cost: mrtFare(k), vehicle: true, seq, hw: OS.headway });
    }
    // 台鐵（模擬行車時間與票價）
    for (const [k2, ride] of Object.entries(TRA_RIDE)) {
      const [a, b] = k2.split('|');
      const hwT = Math.round(headway('tra', dateStr, dep) * (pol && k2.includes('t_shalu') ? POLICY_SIM.coastTraHw : 1));   // 海線雙軌化：班距減半
      edges.push({ a, b, mode: 'tra', wait: hwT / 2, min: ride, cost: TRA_FARE[k2], vehicle: true, hw: hwT });
      edges.push({ a: b, b: a, mode: 'tra', wait: hwT / 2, min: ride, cost: TRA_FARE[k2], vehicle: true, hw: hwT });
    }
    // 狀態：節點＋是否已搭過車；Dijkstra
    const adj = {}; edges.forEach(e => { (adj[e.a] = adj[e.a] || []).push(e); });
    const dist = { 'O|0': 0 }, prev = {}, done = new Set();
    const q = [['O|0', 0]];
    while (q.length) {
      q.sort((x, y) => x[1] - y[1]);
      const [s, d] = q.shift(); if (done.has(s)) continue; done.add(s);
      const [node, used] = s.split('|');
      if (node === 'D' && used === '1') break;
      for (const e of adj[node] || []) {
        if (e.mode === 'walk' && prev[s] && prev[s].e.mode === 'walk') continue;   // 不連續步行兩段
        const ns = `${e.b}|${used === '1' || e.vehicle ? 1 : 0}`;
        const nd = d + e.wait + e.min;
        if (nd < (dist[ns] ?? Infinity)) { dist[ns] = nd; prev[ns] = { s, e }; q.push([ns, nd]); }
      }
    }
    if (dist['D|1'] == null) return null;
    const path = []; for (let s = 'D|1'; prev[s]; s = prev[s].s) path.unshift(prev[s].e);
    const legs = path.map(e => {
      const from = byId[e.a], to = byId[e.b];
      const bp = e.mode === 'bus' ? (TomTom.peekPath('slow', from, to) || Routing.peek('car', from, to))

      if (!impl) return;
      impl.clear('live');
      (list || []).forEach((x, i) => {
        if (x.line.length > 1) { impl.line('live', x.line, { color: '#ffffff', weight: 9, opacity: 0.9 }); impl.line('live', x.line, { color: color('--danger'), weight: 5, opacity: 0.85 }); }
        impl.marker('live', x.at, `<button class="live-mk" data-act="live" data-arg="${i}" aria-label="${esc(x.catName)}">${LIVE_ICON(x.cat)}</button>`, [0, 0], [0, 0], 1600);
      });
    },
    setToken(p, html) { if (impl) impl.setToken(p, html); },
    hideToken() { if (impl) impl.hideToken(); },
    bubble(id, p, html) { if (impl) impl.bubble(id, p, html); },
    unbubble(id) { if (impl) impl.unbubble(id); },
    fit(pts) { if (impl) impl.fit(pts); },
    focus(p, z) { if (impl) { if (impl.focus) impl.focus(p, z); } },
    pan(p) { if (impl) impl.pan(p); },
  };
})();

/** 依對話框在地圖中的位置：太靠上就翻到下方、太靠左右就往內推（尾巴仍指向原點） */

const Sim = (() => {
  let run = null;
  /** 依路段決定這趟會遇到哪些事件（最多 2 個；機率為遊戲設定） */
  function roll(plan) {
    const out = [], pol = !!MODES[plan.mode].base, PS = POLICY_SIM;
    plan.legs.forEach((L, i) => {
      if (L.mode === 'bus' && Math.random() < (pol ? PS.ghost : 0.35)) out.push({ i, key: 'ghost' });
      else if (L.mode === 'mrt' && Math.random() < (pol ? PS.mrt : 0.18)) out.push({ i, key: 'mrt' });
      else if ((L.mode === 'car' || L.mode === 'scooter')) {
        if (plan.live && plan.live.length && Math.random() < 0.8) out.push({ i, key: 'ttlive', data: plan.live[Math.floor(Math.random() * plan.live.length)] });
        else if (Math.random() < 0.12) out.push({ i, key: 'drug' });
        else if (plan.cong >= 1.4 && Math.random() < (pol ? PS.jam : 0.65)) out.push({ i, key: 'jam' });
      } else if ((L.mode === 'walk' && L.min >= 10) || L.mode === 'bike') { if (Math.random() < 0.12) out.push({ i, key: 'rain' }); }
    });
    return out.slice(0, 2);
  }
  function start(plan, ui) {
    stop();
    const legs = plan.legs.map(l => ({ ...l, dur: l.wait + l.min, cum: [0] }));
    legs.forEach(l => { for (let k = 1; k < l.pts.length; k++) l.cum.push(l.cum[k - 1] + km(l.pts[k - 1], l.pts[k])); });
    const events = roll(plan);
    run = { plan, legs, events, ui, legIdx: 0, legT: 0, clock: plan.depart, delay: 0, extraCost: 0, paused: false,
            seenNotes: new Set(), log: [], raf: 0, last: 0, firedEvents: new Set() };
    MapView.drawRoute(plan.legs);
    MapView.focus(legs[0].pts[0], 14);
    ui.onUpdate(run);
    run.last = performance.now();
    run.raf = requestAnimationFrame(tick);
  }
  const posOn = (L, f) => {
    const total = L.cum[L.cum.length - 1] || 1, d = f * total;
    let k = 1; while (k < L.cum.length - 1 && L.cum[k] < d) k++;
    const a = L.pts[k - 1], b = L.pts[k] || a, span = (L.cum[k] - L.cum[k - 1]) || 1, t = clamp((d - L.cum[k - 1]) / span, 0, 1);
    return { lat: a.lat + (b.lat - a.lat) * t, lng: a.lng + (b.lng - a.lng) * t };
  };
  // 每遊戲分鐘的動畫毫秒數：總長壓在約 9–16 秒
  const msPerMin = () => reduceMotion ? 25 : clamp(12000 / Math.max(20, run.plan.min), 90, 260);
  function tick(now) {
    if (!run || run.paused) return;
    const dtMin = (now - run.last) / msPerMin(); run.last = now;
    const L = run.legs[run.legIdx];
    run.legT += dtMin; run.clock += dtMin;
    const moveF = L.dur ? clamp((run.legT - L.wait) / Math.max(0.01, L.min), 0, 1) : 1;
    const p = posOn(L, moveF);
    MapView.setToken(p, tokenHtml(L.mode, run.legT < L.wait));
    MapView.pan(p);
    // 事件
    const ev = run.events.find(e => e.i === run.legIdx && !run.firedEvents.has(e));
    if (ev && run.legT >= L.dur * INCIDENTS[ev.key].at) { run.firedEvents.add(ev); return openIncident(ev, L, p); }
    // 路過政見或建設地點
    for (const a of ANCHORS) {
      if (a.mode && a.mode !== L.mode) continue;
      if (km(p, a.at) < 1.3) for (const n of a.notes) if (!run.seenNotes.has(n)) { showNote(n, a.at); break; }
    }
    if (run.legT >= L.dur) {
      run.legT = 0; run.legIdx++;
      if (run.legIdx >= run.legs.length) return finish();
    }
    run.ui.onUpdate(run);
    run.raf = requestAnimationFrame(tick);
  }
  function showNote(key, at) {
    run.seenNotes.add(key);
    const n = NOTES[key];
    run.log.push({ kind: n.type, html: `<span class="k ${n.type}">${n.type === 'policy' ? '政見' : '建設'}</span> ${esc(n.title)}` });
    MapView.bubble(`n_${key}`, at, noteBubble(n));
    setTimeout(() => MapView.unbubble(`n_${key}`), 7000);
  }
  function openIncident(ev, L, p) {
    run.paused = true;
    const I = INCIDENTS[ev.key];
    const ctx = { legKm: l => l.km || lineKm(l.pts) * 1.3 };
    const opts = I.options(L, ctx, ev);
    run.pending = { ev, L, opts, p };
    const html = `<div class="bub event"><h4><span class="k news">${I.live ? '即時路況' : '突發事件'}</span>${I.icon} ${esc(I.title)}</h4><p>${esc(I.text(run.plan.cong, ev))}</p>
      <div class="choices">${opts.map((o, k) => `<button class="btn" data-act="choose" data-arg="${k}">${esc(o.label)}</button>`).join('')}</div>
      ${I.news ? `<div class="src">新聞依據：${I.news.map(n => `<a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.pub)} ${n.date}</a>`).join('、')}（事件為遊戲模擬）</div>` : I.live ? '<div class="src">來源：TomTom Traffic（查詢當下的路況；延誤分鐘為遊戲估算）</div>' : '<div class="src">遊戲模擬事件</div>'}</div>`;
    MapView.setToken(p, tokenHtml(L.mode, true));
    MapView.bubble('incident', p, html);
    run.ui.onIncident(run, I, opts);
    // 相關政見同時出現（不擋住事件對話框：放在終點方向）
    if (I.note && !run.seenNotes.has(I.note)) {
      const showRoad = I.note !== 'roads' || run.plan.legs.some(l => l.pts.some(q => q.lng < 120.62));   // 海線道路政見只在經過海線時顯示
      const at = run.plan.arrivePt || run.plan.legs[run.plan.legs.length - 1].to;
      // 窄螢幕一次只顯示一個對話框：先處理事件，再顯示相關政見
      if (showRoad) { if (($('#map').clientWidth || 0) < 600) run.deferNote = { key: I.note, at }; else showNote(I.note, at); }
    }
  }
  function choose(k) {
    if (!run || !run.pending) return;
    const { ev, opts } = run.pending, o = opts[k]; if (!o) return;
    const dt = o.dtRand ? randInt(o.dtRand[0], o.dtRand[1]) : o.dt;
    const cur = run.legs[run.legIdx];
    if (dt >= 0) run.clock += dt;                                   // 等待：時鐘往前，路段不變
    else cur.dur = Math.max(run.legT + 1, cur.dur + dt);            // 改搭更快的車：縮短剩下的路段，時鐘不倒退
    run.delay += dt; run.extraCost += o.dc || 0;
    if (o.swap === 'taxi') cur.mode = 'taxi';
    run.log.push({ kind: 'event', html: `${INCIDENTS[ev.key].icon} ${esc(INCIDENTS[ev.key].title)}：${esc(o.label.replace(/（.*?）/, ''))}（${dt >= 0 ? '+' : '−'}${Math.abs(dt)} 分${o.dc ? `、${o.dc > 0 ? '+' : '−'}${money(Math.abs(o.dc))}` : ''}）` });
    run.pending = null; run.paused = false;
    MapView.unbubble('incident');
    if (run.deferNote) { const d = run.deferNote; run.deferNote = null; showNote(d.key, d.at); }
    run.last = performance.now();
    run.ui.onUpdate(run);
    run.raf = requestAnimationFrame(tick);
  }
  function finish() {
    const r = run; r.done = true;
    MapView.setToken(r.plan.legs[r.plan.legs.length - 1].to, tokenHtml(r.legs[r.legs.length - 1].mode, false));
    r.ui.onFinish(r);
  }
  function stop() {
    if (run) { cancelAnimationFrame(run.raf); MapView.unbubble('incident'); Object.keys(NOTES).forEach(k => MapView.unbubble(`n_${k}`)); }
    run = null;
  }
  return { start, choose, stop, get run() { return run; } };
})();


/* ============================ 8. UI ============================ */
const UI = (() => {
  const localDate = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  const nextMonday = () => { const d = new Date(); const add = (8 - d.getDay()) % 7 || 7; d.setDate(d.getDate() + add); return localDate(d); };
  const asPlace = p => ({ ...p, precision: p.precision || '地標', src: p.src || 'Wikipedia' });
  const S = {
    from: asPlace(PLACES.find(p => p.id === 'shalu')), to: asPlace(PLACES.find(p => p.id === 'ntt')),
    date: nextMonday(), time: '09:00', plans: null, view: 'plan', policy: true, blue: false,
    q: { from: '', to: '' }, sugg: { from: [], to: [] }, msg: { from: '', to: '' }, busy: { from: false, to: false },
    seq: 0, live: [], liveAt: null, ttMsg: '', liveMsg: '', ttLoading: false,
  };
  const minuteOf = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  const WEEK = '日一二三四五六';
  const PRESETS = ['tc_stn', 'shalu', 'ntt', 'nmns', 'fengjia', 'thu', 'hsr'].map(id => PLACES.find(p => p.id === id));

  const plan = () => { const ps = Planner.planAll(S.from, S.to, S.date, minuteOf(S.time)); ps.forEach(p => { if (p.tt) p.live = S.live; }); return ps; };
  async function compute() {
    const O = S.from, D = S.to, my = ++S.seq;
    S.live = []; S.liveMsg = ''; S.ttMsg = '';
    if (!O || !D || (Math.abs(O.lat - D.lat) < 1e-5 && Math.abs(O.lng - D.lng) < 1e-5)) { S.plans = []; render(); redrawMap(); return; }
    S.plans = plan(); S.ttLoading = TomTom.state.state !== 'none';
    render(); redrawMap();
    const { tt, ttErr } = await Planner.prefetch(O, D, S.date, minuteOf(S.time));   // 實際道路距離＋TomTom 預測車流
    if (my !== S.seq) return;                                                    // 期間又改了起訖點或時間
    S.ttLoading = false; S.ttMsg = ttErr ? TomTom.explain(ttErr) : '';
    S.plans = plan(); render(); redrawMap();
    if (!tt) return;
    try {
      const live = await TomTom.incidents(tt.pts);
      if (my !== S.seq) return;
      S.live = live; S.liveAt = new Date(); S.plans = plan(); render(); redrawMap();
    } catch (e) { if (my === S.seq) { S.liveMsg = TomTom.explain(e); render(); } }
  }
  function redrawMap(fitPolicy) {
    MapView.whenReady(() => {
      MapView.drawPolicy(S.policy);
      MapView.drawBase(S.from, S.to);
      MapView.drawLive(S.live);
      const best = S.plans && S.plans.length ? S.plans.slice().sort((a, b) => a.min - b.min)[0] : null;
      if (S.view === 'plan') { MapView.drawRoute(best ? best.legs : []); MapView.hideToken(); }
      const pts = fitPolicy === 'city' ? TAICHUNG_BOUNDS : Array.isArray(fitPolicy) ? fitPolicy : fitPolicy ? Object.values(PT) : [S.from, S.to].concat(best ? best.legs.flatMap(l => l.pts) : []);
      MapView.fit(pts);
    });
  }
  const precisionText = p => {
    const how = p.precision === '門牌' ? '定位到門牌' : p.precision === '道路' ? '只定位到路段，請拖曳圖釘校正' :
                p.precision === '手動校正' ? '已手動校正位置' : p.precision === '地標' ? '地標座標' : '定位到地點';
    return `<b>${esc(p.addr || p.name)}</b>・${how}（${esc(p.src)}）`;
  };
  function whereBlock(which) {
    const p = S[which], label = which === 'from' ? '出發' : '抵達';
    const list = S.sugg[which];
    return `<div class="where"><span class="dot${which === 'to' ? ' d' : ''}" aria-hidden="true"></span>
      <div style="min-width:0"><span class="lbl">${label}</span>
        <div class="addr-in"><input id="${which}Q" data-q="${which}" value="${esc(S.q[which] || p.name)}" placeholder="輸入地址或地名，例如：西屯區惠來路二段101號" autocomplete="off" aria-label="${label}地址">
          <button data-act="find" data-arg="${which}">${S.busy[which] ? '定位中…' : '定位'}</button></div>
        <div class="addr-meta">${S.msg[which] ? esc(S.msg[which]) : precisionText(p)}</div>
        ${list.length ? `<ul class="sugg">${list.map((r, i) => `<li><button data-act="pickAddr" data-arg="${which}|${i}">${esc(r.name)}<small>${esc(r.addr || '')}・${esc(r.precision)}・${esc(r.src)}</small></button></li>`).join('')}</ul>` : ''}
        <div class="presets" style="margin-top:6px">${PRESETS.map(pp => `<button data-act="preset" data-arg="${which}|${pp.id}">${esc(pp.name)}</button>`).join('')}</div>
      </div></div>`;
  }
  const rowHtml = (p, best) => {
    const hyp = MODES[p.mode].hyp;
    const diff = hyp && p.vsNow != null ? (p.vsNow > 0 ? `<em class="gain">快 ${p.vsNow} 分</em>` : '<span class="same">時間相同</span>') : '';
    return `<button class="row${p === best ? ' best' : ''}${hyp ? ' hyp' : ''}" data-act="go" data-arg="${p.mode}">
      <span class="ic" aria-hidden="true">${hyp ? '' : MODES[p.mode].icon}</span>
      <span><span class="nm">${hyp ? '<span class="tagp">何欣純政見版</span>' : esc(MODES[p.mode].name)}${p === best ? '<small>最快</small>' : ''}${!hyp && p.min > 150 ? '<small>太遠</small>' : ''}</span>
        <span class="sub">${fmt(p.depart)} 出發・${money(p.cost)}${p.tt && !hyp ? '・<span class="k tt">TomTom 預測</span>' : ''}${baseOf(p.mode) === 'transit' ? `・${p.legs.map(l => LEG[l.mode].icon).join(' ')}` : ''}${diff ? `・${diff}` : ''}</span></span>
      <span class="min">${p.min}<span>分</span></span></button>`;
  };
  function rows() {
    if (!S.plans) return '<p class="fine">計算中…</p>';
    if (!S.plans.length) return '<p class="fine">出發地和目的地要不一樣。</p>';
    const now = S.plans.filter(p => !MODES[p.mode].hyp), pol = S.plans.filter(p => MODES[p.mode].hyp);
    const best = now.slice().sort((a, b) => a.min - b.min)[0], bestP = pol.slice().sort((a, b) => a.min - b.min)[0];
    const groups = BASE_MODES.map(m => S.plans.filter(p => baseOf(p.mode) === m)).filter(g => g.length);
    return `<p class="lead">現況最快是<em>${MODES[best.mode].name}</em> ${best.min} 分鐘，<em>${fmt(best.depart)}</em> 前出發就能 ${esc(S.time)} 到。</p>
      <div class="rows">${groups.map(g => `<div class="pair">${g.map(p => rowHtml(p, p === best || p === bestP ? p : null)).join('')}</div>`).join('')}</div>
      ${ttNote()}${conclusion(now, pol)}`;
  }
  /** 結論：比較現況與政見版（依遊戲假設試算） */
  function conclusion(now, pol) {
    const best = now.slice().sort((a, b) => a.min - b.min)[0], bestP = pol.slice().sort((a, b) => a.min - b.min)[0];
    const gains = pol.filter(p => p.vsNow > 0).sort((a, b) => b.vsNow - a.vsNow);
    const trips = 500;   // 一年約 250 個工作天、每天來回
    const link = `<a class="btn primary island" href="https://taichung-island.netlify.app/" target="_blank" rel="noopener">到「台中政策島」看何欣純的完整政見 →</a>`;

        <li>大眾運輸：在綠線 18 站、台鐵沙鹿／大慶／臺中站與起訖點間找最快組合；候車＝班距÷2（班距為模擬）；公車以一般市區公車估算，未指定路線。</li>
        <li>綠線票價：起價 $20、每 2 km 加 $5、上限 $50（Wikipedia 引 2020 年資料）。其他票價、油錢、停車費為模擬。</li>
        <li>何欣純政見版（遊戲假設，非官方評估）：藍線通車（臺中港、沙鹿車站、東海大學、市政府站一帶、臺中車站；時速 ${BLUE_SIM.kmh} km、班距 ${BLUE_SIM.headway} 分）；橘線延伸清水站通車（清水車站、臺中機場、臺中車站；時速 ${POLICY_SIM.orange.kmh} km、班距 ${POLICY_SIM.orange.headway} 分）；公車班距縮短三分之一；海線台鐵班距減半；開車、機車塞車延誤減少 30%；汽車找車位時間減半、停車費 $${POLICY_SIM.carParkFee}；機車停車 4 → 2 分；走路、騎腳踏車快 5%、借還車 3 → 2 分；幽靈公車、捷運故障、塞車事件機率降低。</li></ul>
      <h3>政見與建設（只引用何欣純政見）</h3><ul>${POLICY_MAP.map(p => `<li><span class="k ${p.kind}">${KIND_LABEL[p.kind]}</span> ${esc(p.title)}：${p.src.map(k => `<a href="${esc(SRC[k][1])}" target="_blank" rel="noopener">${esc(SRC[k][0])}</a>`).join('、')}</li>`).join('')}</ul>
      <h3>意外事件的新聞依據</h3><ul>${[...NEWS.ghost, ...NEWS.mrt, ...NEWS.drug].map(n => `<li><a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.pub)} ${n.date}：${esc(n.title)}</a></li>`).join('')}</ul>
      <h3>地點座標</h3><p class="fine">綠線 18 站與地標：各 Wikipedia 條目與臺中觀光旅遊網（2026-10-24 查證）。地址搜尋：TomTom（連接器）、Photon、Nominatim（OpenStreetMap）。底圖：國土測繪中心臺灣通用電子地圖、OpenStreetMap。</p>
      <p style="margin-top:16px"><button class="btn primary" data-act="closeInfo">知道了</button></p>`;
    $('#sheet').hidden = false;
  }
  return { S, showMap, render, compute, go, askGo, back, find, pickAddr, preset, movePin, showPolicy, showLive, policyList, policyOnMap, info, redrawMap };
})();


/* ============================ 第一次使用教學 ============================
 * 彈跳視窗＋手指，依序引導：出發地址 → 定位 → 選位置 → 抵達地址 → 定位 → 選位置 → 選通勤方式。
 * 每次畫面重繪後重新找目標元素並定位（Tour.refresh 由 UI.render 呼叫）。 */
const Tour = (() => {
  const KEY = 'tcb_tour_done';
  const store = { get: () => { try { return localStorage.getItem(KEY); } catch (e) { return null; } }, set: () => { try { localStorage.setItem(KEY, '1'); } catch (e) {} } };
  const W = { from: '出發', to: '抵達' };
  const STEPS = [
    { id: 'from-type', which: 'from', sel: '#fromQ', title: '① 輸入出發地址', text: '點這裡，輸入出發的地址或地名，例如「西屯區惠來路二段101號」。也可以點下面的常用地點。', next: 'find:from', btn: '輸入好了' },
    { id: 'from-find', which: 'from', sel: '[data-act="find"][data-arg="from"]', title: '② 按「定位」', text: '按「定位」，搜尋這個地址。', next: 'find:from' },
    { id: 'from-pick', which: 'from', sel: '#panel .where:nth-of-type(1) .sugg, #panel .where:nth-of-type(1) .presets', title: '③ 選擇位置', text: '從清單中點選正確的位置。找不到時，可以改點常用地點。', next: 'pick:from' },
    { id: 'to-type', which: 'to', sel: '#toQ', title: '④ 輸入抵達地址', text: '接著輸入要去的地方，例如公司或學校的地址。', next: 'find:to', btn: '輸入好了' },
    { id: 'to-find', which: 'to', sel: '[data-act="find"][data-arg="to"]', title: '⑤ 按「定位」', text: '按「定位」，搜尋抵達地址。', next: 'find:to' },
    { id: 'to-pick', which: 'to', sel: '#panel .where:nth-of-type(2) .sugg, #panel .where:nth-of-type(2) .presets', title: '⑥ 選擇位置', text: '從清單中點選正確的位置。', next: 'pick:to' },
    { id: 'choose', sel: '#panel .rows .pair', title: '⑦ 選一種通勤方式', text: '這裡比較開車、騎機車、大眾運輸、走路、騎腳踏車要多久、花多少錢。每一種都有「現況」和下方的「何欣純政見版」。點任一行，就開始模擬通勤！', next: 'choose', scroll: true },
  ];
  let idx = -1, tip = null, finger = null, hl = null, lastScrolled = -1;
  const active = () => idx >= 0;
  function clear() {
    if (hl) hl.classList.remove('tour-hl'); hl = null;
    if (tip) tip.remove(); if (finger) finger.remove(); tip = finger = null;
  }
  function welcome() {
    $('#sheetBox').innerHTML = `<h2>歡迎來到台中通勤大作戰</h2>
      <p>只要三步：</p><ol class="tour-ol"><li>輸入<b>出發</b>地址，按「定位」，選擇位置。</li><li>輸入<b>抵達</b>地址，按「定位」，選擇位置。</li><li>看各種通勤方式要多久、花多少錢，點一種開始模擬。</li></ol>
      <p class="fine">右上角可以把字體調成「大」。</p>
      <div class="btns" style="margin-top:14px"><button class="btn primary" data-act="tourStart">開始教學</button><button class="btn" data-act="tourSkip">我會用，跳過</button></div>`;
    $('#sheet').hidden = false;
  }
  function start() { $('#sheet').hidden = true; idx = 0; lastScrolled = -1; refresh(); }
  function end() { idx = -1; clear(); store.set(); }
  function go(k) { idx = k; if (idx >= STEPS.length) return end(); refresh(); }
  function event(name) {
    if (!active()) return;
    const st = STEPS[idx];
    if (name === st.next) { go(idx + (st.id.endsWith('type') ? 2 : 1)); return; }
    // 也接受跳步：例如直接點常用地點
    const k = STEPS.findIndex((x, i) => i > idx && x.next === name);
    if (k >= 0) go(k + 1);
  }
  function refresh() {
    if (!active()) return;
    const st = STEPS[idx];
    if (UI.S.view !== 'plan' || !$('#sheet').hidden) { clear(); return; }
    // 「選擇位置」：等查詢完成；有建議清單就指向清單，否則指向常用地點
    let el = null;
    for (const sel of st.sel.split(', ')) { el = document.querySelector(sel); if (el && (!sel.includes('.sugg') || el.children.length)) break; el = null; }
    if (st.id.endsWith('pick') && UI.S.busy[st.which]) el = null;
    clear();
    if (!el) return;
    hl = el; el.classList.add('tour-hl');
    if (lastScrolled !== idx || st.scroll) {
      const r0 = el.getBoundingClientRect();
      if (r0.top < 70 || r0.bottom > window.innerHeight - 160) el.scrollIntoView({ block: 'center', behavior: 'auto' });
      lastScrolled = idx; st.scroll = false;
    }
    tip = document.createElement('div'); tip.className = 'tour-tip'; tip.setAttribute('role', 'dialog');
    tip.innerHTML = `<span class="step">使用教學 ${idx + 1} / ${STEPS.length}</span><h4>${st.title}</h4><p style="margin:0">${st.text}</p>
      <div class="row2"><button class="linkbtn" data-act="tourSkip">結束教學</button>${st.btn ? `<button class="btn primary" data-act="tourNext">${st.btn}</button>` : ''}</div>`;
    finger = document.createElement('div'); finger.className = 'tour-finger'; finger.textContent = '👆'; finger.setAttribute('aria-hidden', 'true');
    document.body.append(tip, finger);
    place();
  }
  function place() {
    if (!tip || !hl) return;
    const r = hl.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight;
    const tw = tip.offsetWidth, th = tip.offsetHeight, fs = finger.offsetHeight || 40;
    // 手指：在目標下方偏左，指向目標
    const fx = Math.min(vw - 44, Math.max(4, r.left + Math.min(40, r.width / 2) - 12));
    let below = r.bottom + fs + 8 + th < vh || r.top < th + fs + 16;
    const fy = below ? r.bottom + 2 : r.top - fs - 2;
    finger.style.left = `${fx}px`; finger.style.top = `${fy}px`;
    finger.textContent = below ? '👆' : '👇';
    // 說明框：避開目標，不遮住
    let ty = below ? fy + fs + 6 : fy - th - 6;
    ty = Math.max(8, Math.min(vh - th - 8, ty));
    let tx = Math.max(16, Math.min(vw - tw - 16, r.left));
    tip.style.left = `${tx}px`; tip.style.top = `${ty}px`;
  }
  window.addEventListener('scroll', () => place(), { passive: true });
  window.addEventListener('resize', () => refresh());
  function next() {
    const st = STEPS[idx];
    if (st && st.id.endsWith('type')) { const v = ($(st.sel) || {}).value; if (v && v.trim()) { UI.find(st.which); return; } }
    go(idx + 1);
  }
  function maybeWelcome() { if (!store.get()) welcome(); }
  return { start, end, event, refresh, welcome, maybeWelcome, next, active };
})();

/* ---------- 字體大小 ---------- */
const FontSize = (() => {
  const KEY = 'tcb_fs';
  function set(v, save = true) {
    document.documentElement.dataset.fs = v; declutterSoon();
    document.querySelectorAll('.fsz button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.arg === v)));
    if (save) { try { localStorage.setItem(KEY, v); } catch (e) {} }
    Tour.refresh();
  }
  let v = 'm'; try { v = localStorage.getItem(KEY) || 'm'; } catch (e) {}
  set(v, false);
  return { set };
})();

/* ---------- 輸入（捕獲階段，避免被地圖攔截） ---------- */
const ACT = {
  fs: a => FontSize.set(a), tour: () => { UI.back(); Tour.welcome(); }, tourStart: () => Tour.start(), tourSkip: () => { $('#sheet').hidden = true; Tour.end(); }, tourNext: () => Tour.next(),
  go: a => UI.askGo(a), goNow: a => UI.go(a), policyList: () => UI.policyList(), policyOnMap: a => UI.policyOnMap(a), back: () => UI.back(), choose: a => Sim.choose(Number(a)), info: () => UI.info(),
  closeInfo: () => { $('#sheet').hidden = true; Tour.refresh(); }, find: a => UI.find(a), pickAddr: a => UI.pickAddr(a), preset: a => UI.preset(a),
  policy: (a, el, at) => UI.showPolicy(a, at), live: a => UI.showLive(Number(a)), ttRetry: () => UI.compute(), fitPolicy: () => { UI.S.policy = true; UI.render(); UI.redrawMap('city'); UI.showMap(); },
  closeBub: (a, el) => { const host = el.closest('[data-bub]'); const b = el.closest('.bub'); if (b) b.remove(); if (host) host.remove(); },
};
let lastKey = '', lastAt = 0;
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act; if (!ACT[act] || el.tagName === 'SELECT' || el.tagName === 'INPUT') return;
  e.preventDefault(); e.stopPropagation();
  const key = `${act}:${el.dataset.arg || ''}`, now = Date.now();
  if (key === lastKey && now - lastAt < 350) return;           // 防止連點
  lastKey = key; lastAt = now;
  ACT[act](el.dataset.arg, el);
}, true);
document.addEventListener('change', e => {
  const el = e.target, S = UI.S;
  if ((el.dataset.act === 'date' || el.dataset.act === 'time') && el.value) { S[el.dataset.act] = el.value; UI.compute(); }
  if (el.dataset.act === 'togglePolicy') { S.policy = el.checked; UI.redrawMap(); }
});
document.addEventListener('input', e => { const w = e.target.dataset && e.target.dataset.q; if (w) UI.S.q[w] = e.target.value; });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $('#sheet').hidden = true;
  const w = e.target.dataset && e.target.dataset.q;
  if (e.key === 'Enter' && w) { e.preventDefault(); UI.find(w); }
});
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') $('#sheet').hidden = true; });

/* 啟動 */
MapView.onPin = (which, ll) => UI.movePin(which, ll);
UI.compute();
MapView.init().then(() => UI.redrawMap());
Tour.maybeWelcome();

</script>
